<style>
:root{--ink:#243247;--muted:#8a96a7;--line:#e6eaf0;--blue:#5266e8;--bg:#f5f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px "Microsoft YaHei UI","Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 13px;transition:.15s}button:hover{border-color:#bbc4ff;background:#f4f5ff}button:disabled{opacity:.4;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#4357da;color:white}.quiet{background:transparent;border-color:transparent;color:#768399}.shell{display:grid;grid-template-columns:76px 1fr;height:100vh;min-height:630px}.rail{background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:14px;padding:24px 10px}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--blue);color:white;font-size:24px;font-weight:700;box-shadow:0 6px 15px #5266e82b;margin-bottom:25px}.rail button{font-size:22px;border:0;width:44px;height:44px;padding:6px;color:#78839a}.rail .active{color:var(--blue);background:#eef0ff}.rail .bottom{margin-top:auto}.main{min-height:0;display:flex;flex-direction:column;min-width:0;padding:0 28px}.top{height:90px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:18px;font-weight:700;letter-spacing:-.5px}.brand span{font-size:11px;margin-left:12px;font-weight:400;color:var(--muted);letter-spacing:1px}.subtitle{margin-top:7px;color:#8c97a7;font-size:11px}.top-actions{display:flex;gap:8px;align-items:center}.local{font-size:11px;color:#7e8f87;margin-right:13px}.local:before{content:'';display:inline-block;width:6px;height:6px;border-radius:100%;background:#64b59c;margin-right:7px}.parameters{display:flex;align-items:end;gap:18px;padding:18px 22px;background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:11px;color:#8792a4}.field input,.field select{background:#f8f9fc;border:1px solid #e8ebf2;outline:none;border-radius:6px;padding:9px 11px;color:var(--ink);width:100%}.field input:focus{border-color:#8897f8}.parameters .field{width:185px}.parameters .small{width:95px}.rule{margin-left:auto;color:#8e98a9;font-size:11px;line-height:1.9}.rule strong{font-weight:500;color:#69778c}.workspace{display:grid;grid-template-columns:310px 1fr;gap:18px;flex:1;min-height:0}.panel{min-height:0;background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}.panel-head{height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f6}.panel-head h2{font-size:13px;margin:0}.badge{font:11px "Segoe UI",sans-serif;background:#f0f2f8;color:#8c97a8;padding:4px 7px;border-radius:5px}.filters{display:flex;gap:8px;padding:14px 16px 10px}.filters select{width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:8px;color:#67768b}.search{margin:0 16px 10px;border:1px solid var(--line);padding:8px 10px;border-radius:6px;outline:none;width:calc(100% - 32px);font-size:12px}.table-wrap{overflow:auto;flex:1}table{border-collapse:collapse;width:100%;font-size:11px}th{text-align:left;color:#97a1af;background:#fafbfc;font-weight:400;position:sticky;top:0;padding:11px 12px}td{padding:10px 12px;border-bottom:1px solid #f5f6f9;font-family:Consolas,"Microsoft YaHei UI",monospace}tr:hover td{background:#f5f6ff;cursor:pointer}tr.issue td{background:#fffaf0}td:nth-child(2){max-width:138px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.type{font-size:9px;padding:3px 5px;background:#f0f3fb;color:#8791ae;border-radius:4px}.list-bottom{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:6px}.list-bottom button{font-size:11px;padding:6px 10px}.canvas-head{height:60px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #f0f2f6;gap:20px}.tab{border:none;border-radius:0;height:60px;padding:0 2px;color:#929dae;background:none}.tab.selected{color:var(--blue);border-bottom:2px solid var(--blue)}.canvas-tools{margin-left:auto;display:flex;gap:6px;align-items:center}.canvas-tools button{border:0;color:#8b97aa;padding:6px 9px}.zoom-label{font:11px Consolas;color:#a1a9b8;min-width:37px;text-align:center}.stage{position:relative;flex:1;min-height:0;background-color:#fcfcfe;background-image:radial-gradient(#dde2ed .7px,transparent .7px);background-size:16px 16px;overflow:hidden;touch-action:none}.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}.stage .hint{position:absolute;bottom:17px;left:20px;color:#a0a9b7;font-size:10px;pointer-events:none}.empty{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#9ba5b7}.empty-icon{width:66px;height:66px;border:1px dashed #c9d0e8;border-radius:18px;display:grid;place-items:center;font-size:30px;color:#98a6e5;margin-bottom:22px}.empty h2{font-size:17px;font-weight:500;color:#4d5d76;margin:0 0 10px}.empty p{font-size:12px;margin:0 0 22px}.review{padding:18px;overflow:auto;flex:1;display:none}.issue-card{padding:14px;border:1px solid #eee9dc;background:#fffcf6;border-radius:8px;margin-bottom:10px;line-height:1.8}.issue-card button{font-size:11px;margin-top:9px}.footer{height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px}.status{font-size:11px;color:#8e99a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status.error{color:#b15d4d}.footer-right{display:flex;align-items:center;gap:14px}.footnote{font-size:10px;color:#a2aab7}.build{padding:11px 22px;box-shadow:0 4px 12px #5266e824}.busybar{height:2px;background:linear-gradient(90deg,transparent,#7685ef,transparent);position:fixed;top:0;left:0;width:100%;animation:pulse 1s infinite;display:none}@keyframes pulse{50%{opacity:.25}}dialog{border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 90px #26345433;padding:28px;width:470px;color:var(--ink)}dialog::backdrop{background:#26345444;backdrop-filter:blur(3px)}dialog h2{font-size:18px;margin:0 0 10px}dialog p{color:#8994a6;line-height:1.8;font-size:12px}dialog .field{margin:13px 0}dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#26344a;color:white;padding:12px 22px;border-radius:9px;box-shadow:0 8px 28px #24324722;max-width:70%;white-space:pre-wrap;z-index:9;display:none}.source{white-space:pre-wrap;font-size:11px;background:#f7f8fb;padding:12px;border-radius:8px;color:#748198;max-height:190px;overflow:auto}.drop-active{outline:2px dashed var(--blue);outline-offset:-5px}@media(max-width:1100px){.main{padding:0 15px}.workspace{grid-template-columns:265px 1fr}.rule,.brand span,.local{display:none}.parameters{gap:10px}.parameters .field{width:155px}.footnote{display:none}}@media(max-width:800px){.shell{grid-template-columns:55px 1fr}.rail{padding:20px 5px}.workspace{grid-template-columns:220px 1fr}.top{height:75px}.parameters{flex-wrap:wrap;padding:12px}.brand{font-size:15px}.parameters .field{width:130px}.main{padding:0 10px}.top-actions button{font-size:11px;padding:7px}.top-actions{gap:4px}}

/* Keep long pin tables inside a bounded workspace. */
.workspace{flex:none;height:clamp(300px,calc(100vh - 346px),680px);grid-template-columns:340px minmax(0,1fr)}
.table-wrap{min-height:0;overflow-y:scroll;overflow-x:auto;scrollbar-gutter:stable;scrollbar-width:auto;scrollbar-color:#bac3d6 #f3f5f9}
.table-wrap::-webkit-scrollbar{width:11px;height:9px}
.table-wrap::-webkit-scrollbar-track{background:#f3f5f9;border-radius:8px}
.table-wrap::-webkit-scrollbar-thumb{background:#bac3d6;border:3px solid #f3f5f9;border-radius:8px}
.table-wrap::-webkit-scrollbar-thumb:hover{background:#909eb8}
@media(max-width:1100px){.workspace{grid-template-columns:290px minmax(0,1fr)}}
@media(max-width:800px){.workspace{grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 300px);min-height:320px}}
.pcb{display:none;flex:1;min-height:0;overflow:auto;padding:20px}.pcb-grid{display:grid;grid-template-columns:minmax(230px,1fr) minmax(250px,1.2fr);gap:20px}.footer-right select{font:inherit;color:#596981;background:white;border:1px solid var(--line);padding:9px;border-radius:8px}.pcb-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}.pcb-metrics div{background:#f7f9fd;border:1px solid #edf0f7;border-radius:8px;padding:14px;line-height:1.8}.pcb-metrics small{display:block;color:#8a96a7}.pcb-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pcb-note{font-size:12px;color:#758299;line-height:1.8;margin:0 0 14px}.pcb-preview{height:300px;background:#f7f9fd;border-radius:12px;overflow:hidden}.pcb-preview svg{width:100%;height:100%}.pcb-check{display:block;line-height:1.9;margin:16px 0;color:#596981}.pcb details{margin-top:16px}.pcb summary{cursor:pointer;color:#6e7f98}.pcb .actions{display:flex;gap:8px;flex-wrap:wrap}.pcb-warning{background:#fff7e9;padding:12px;border-radius:8px;margin-bottom:12px;color:#896834}@media(max-width:1000px){.pcb-grid{grid-template-columns:1fr}.pcb-preview{height:230px}}

.main{padding-bottom:58px}.pcb-layers{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 10px;font-size:11px;color:#69788f}.pcb-layers label{display:flex;align-items:center;gap:4px;cursor:pointer}.pcb-layers input{accent-color:#5266e8}.pcb-preview{touch-action:none;cursor:grab}.pcb-preview:active{cursor:grabbing}.pcb-preview-note{font-size:11px;line-height:1.9;color:#8793a6;margin:10px 0 14px}.pcb-placeholder{padding:40px;color:#8795ab}.task-progress{position:fixed;bottom:0;left:76px;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 28px;background:#fff;border-top:1px solid #e6eaf0;z-index:5;font-size:12px;color:#7d8ba0}.task-progress-label{max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-progress-track{flex:1;height:14px;background:#edf0f7;border-radius:8px;overflow:hidden}.task-progress-bar{height:100%;width:0;background:#687be8;border-radius:4px;transition:width .3s}.task-progress.running .task-progress-bar{animation:task-slide 1.8s ease-in-out infinite}.task-progress.failed .task-progress-bar{background:#d49b8d}.task-progress.failed{color:#b15d4d}@keyframes task-slide{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}@media(max-width:800px){.task-progress{left:55px;padding:0 12px;gap:8px}}
</style></head><body><div class="busybar" id="busybar"></div><div class="shell"><nav class="rail"><div class="logo">S</div><button class="active" title="器件符号">▦</button><button title="导入资料" onclick="pick('import')">＋</button><button title="参考截图" onclick="pick('reference')">▧</button><button title="多 PART 管理" onclick="partsDialog()">⊞</button><button class="bottom" title="环境设置" onclick="environmentDialog()">⚙</button></nav><main class="main"><header class="top"><div><div class="brand">Symbol Studio <span>器件符号工作台</span></div><div class="subtitle">一份规格书 → 原理图符号 + PCB 封装 · 本地生成与回读验证</div></div><div class="top-actions"><span class="local">本地运行</span><button class="quiet" onclick="resume()">继续上次</button><button onclick="downloadProject()">保存项目</button><button class="primary" onclick="pick('import')">＋ 导入资料</button></div></header>
<section class="parameters"><div class="field"><label>器件名称</label><input id="device" placeholder="如 SC855SL" onchange="metadata()"></div><div class="field"><label>PCB 封装名称</label><input id="footprint" placeholder="自动识别，或填写已有封装名" onchange="metadata()"></div><div class="field small"><label>预期脚数</label><input id="expected" type="number" min="1" placeholder="自动" onchange="metadata()"></div><div class="field"><label>默认布局</label><select id="profile" onchange="metadata(true)"><option value="sensor">SENSOR · 功能分组</option><option value="simple">普通 IC · 逆时针</option></select></div><div class="rule"><strong>上电源 · 下 GND</strong><br>左控制 · 右 MIPI · 10 MIL</div></section>
<section class="workspace"><aside class="panel"><div class="panel-head"><h2>引脚清单</h2><span class="badge" id="count">0 pins</span></div><div class="filters"><select id="part" onchange="activePart=this.value;fit();render()"><option>A · 主单元</option></select></div><input class="search" id="search" placeholder="搜索脚号、信号名称…" oninput="renderTable()"><div class="table-wrap"><table><thead><tr><th>脚号</th><th>信号名称</th><th>类型</th></tr></thead><tbody id="pins"></tbody></table></div><div class="list-bottom"><button onclick="act({action:'undo'})">↶ 撤销</button><button onclick="act({action:'relayout'})">自动重排</button><button onclick="partsDialog()">多 PART</button><button class="quiet" title="新建项目" onclick="newProject()">＋</button></div></aside>
<div class="panel"><div class="canvas-head"><button class="tab selected" id="canvas-tab" onclick="tab(false)">符号画布</button><button class="tab" id="pcb-tab" onclick="pcbTab()">PCB 封装</button><button class="tab" id="review-tab" onclick="tab(true)">来源与核对 <span id="issue-count"></span></button><div class="canvas-tools"><span class="zoom-label" id="zoom">100%</span><button title="适应窗口" onclick="fit();draw()">⛶</button><button title="参考截图调整" onclick="pick('reference')">▧</button></div></div><div class="stage" id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div class="empty" id="empty"><div class="empty-icon">⌁</div><h2>从一份规格书开始</h2><p>拖入 PDF、CSV 或项目文件，自动生成默认布局</p><div><button class="primary" onclick="pick('import')">导入资料</button> <button onclick="act({action:'demo'})">示例体验</button></div></div><div class="hint">滚轮缩放 · 右键拖动画布 · 拖动引脚调整布局 · 布局示意</div></div><div class="review" id="review"></div><div class="pcb" id="pcb"></div></div></section><footer class="footer"><div class="status" id="status">准备就绪 · 导入资料或打开示例</div><div class="footer-right"><span class="footnote" id="source-name">资料保存在本机，不上传云端</span><select id="build-mode" title="生成内容"><option value="build-all">符号 + PCB</option><option value="build">仅符号 OLB</option></select><button id="download" style="display:none" onclick="downloadResult()">下载结果</button><button class="primary build" id="build" onclick="requestBuild()" disabled>生成并验证 →</button></div></footer></main></div><div id="task-progress" class="task-progress" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="task-progress-label" class="task-progress-label">准备就绪</span><div class="task-progress-track"><div id="task-progress-bar" class="task-progress-bar"></div></div><span id="task-progress-value">就绪</span></div><input type="file" id="file" hidden><dialog id="dialog"></dialog><div class="toast" id="toast"></div>
<script src="/pcb-preview.js"></script>
<script>
const TOKEN='__TOKEN__';let state=null,activePart='A',zoom=1,pan={x:0,y:0},view=null,drag=null,lastBusy=false,importPending=false,toastTimer,requestBusy=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',6500)}
async function api(path,data){let r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Workspace-Token':TOKEN,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(r.status===403&&!data){location.reload();throw Error('服务已重启，正在重新连接')}if(!r.ok)throw Error(j.error||'请求失败');return j}
async function act(data){if(requestBusy)return;requestBusy=true;try{state=await api('/api/action',data);lastBusy=!!state.job.busy;render()}catch(e){toast(e.message)}finally{requestBusy=false}}
async function refresh(){try{let wasEmpty=!state;let s=await api('/api/state');let completed=lastBusy&&!s.job.busy;lastBusy=s.job.busy;state=s;if(s.job.busy||completed||!view)render();if(wasEmpty&&location.hash==='#pcb')pcbTab();if(completed){if(s.job.error)toast(s.job.error);else if(importPending){fit();draw();if(Object.keys(s.project.parts).length===1)partsDialog(true)}importPending=false;if(s.reference)referenceDialog()}}catch(e){$('status').textContent='本地服务未连接：请双击启动符号助手.cmd，保持服务窗口打开后刷新页面'}setTimeout(refresh,900)}
function render(){if(!state)return;let p=state.project;for(let [id,key] of [['device','device'],['footprint','footprint'],['expected','expected_count'],['profile','profile']])if(document.activeElement!==$(id))$(id).value=p[key]??'';let parts=Object.keys(p.parts);if(!parts.includes(activePart))activePart=parts[0]||'A';$('part').innerHTML=parts.map(k=>`<option value="${esc(k)}">${esc(k)} · ${esc(p.parts[k])}</option>`).join('');$('part').value=activePart;$('count').textContent=p.pins.length+' pins';$('issue-count').textContent=state.issues.length?`(${state.issues.length})`:'';$('build').disabled=state.job.busy||!p.pins.length;$('build').title=state.issues.length?state.issues[0].text:!p.footprint?'请填写 PCB 封装名称':'生成 OLB 并逐脚回读验证';$('busybar').style.display=state.job.busy?'block':'none';$('status').classList.toggle('error',!!state.job.error);$('status').textContent=state.job.error|| (state.job.busy?state.job.message:state.issues.length?`${p.pins.length} 个引脚 · ${state.issues.length} 项待核对 · 修改自动保存`:state.job.message);$('source-name').textContent=p.sources.length?p.sources.map(s=>s.path.split(/[\\/]/).pop()).join(' · '):'资料保存在本机，不上传云端';renderTable();renderIssues();renderPCB();draw();renderProgress();$('download').style.display=p.generated?.archive?'inline-block':'none'}
function renderTable(){if(!state)return;let term=$('search').value.toLowerCase(),bad=new Set(state.issues.map(i=>i.pin));$('pins').innerHTML=state.project.pins.filter(p=>(p.part||'A')===activePart&&`${p.id} ${p.name}`.toLowerCase().includes(term)).map(p=>`<tr class="${bad.has(p.id)?'issue':''}" data-pin="${esc(p.id)}"><td>${esc(p.id)}</td><td title="${esc(p.name)}">${esc(p.name)}</td><td><span class="type">${esc(p.type||'待定')}</span></td></tr>`).join('');$('pins').querySelectorAll('tr').forEach(r=>r.onclick=()=>editDialog(r.dataset.pin))}
function renderIssues(){$('review').innerHTML=state.issues.length?state.issues.map((i,n)=>`<div class="issue-card">${esc(i.text)}<br><button data-issue="${n}">${i.blocking?'编辑修正':'已核对，确认此项'}</button></div>`).join(''):'<div class="empty-icon">✓</div><h3>当前检查通过</h3><p>填写 PCB 封装名称后，即可生成并逐脚验证 OLB。</p>';if(state.project.generated)$('review').innerHTML+=`<div class="issue-card">${state.project.generated.warning?esc(state.project.generated.warning):state.project.generated.report?.pcb?'符号 + PCB 已生成并通过毫米物理尺寸回读验证':'OLB 已生成并通过回读验证'}<div class="source">${esc(state.project.generated.olb)}</div></div>`;$('review').querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{let i=state.issues[+b.dataset.issue];i.blocking?i.pin?editDialog(i.pin):toast(i.text):act({action:'confirm',key:i.key})})}
function tab(review){$('pcb').style.display='none';$('pcb-tab').classList.remove('selected');$('review').style.display=review?'block':'none';$('stage').style.display=review?'none':'block';$('canvas-tab').classList.toggle('selected',!review);$('review-tab').classList.toggle('selected',review);if(!review)draw()}
function fit(){zoom=1;pcbZoom=1;pcbPan={x:0,y:0};pan={x:0,y:0};if($('pcb').style.display==='block')drawPCB()}
function draw(){let s=state?.sections.find(s=>s.part===activePart);$('empty').style.display=state?.project.pins.length?'none':'flex';$('zoom').textContent=Math.round(zoom*100)+'%';if(!s){$('svg').innerHTML='';view=null;if(state?.preview_error){$('empty').style.display='flex';$('empty').innerHTML=`<h2>布局需要修正</h2><p>${esc(state.preview_error)}</p>`}return}let w=$('stage').clientWidth,h=$('stage').clientHeight;if(!w||!h)return;let scale=Math.min(w/(s.width+160),h/(s.height+160))*zoom,ox=w/2-s.width*scale/2+pan.x,oy=h/2-s.height*scale/2+pan.y;view={s,scale,ox,oy};let lines=`<g transform="translate(${ox},${oy}) scale(${scale})"><rect width="${s.width}" height="${s.height}" fill="white" stroke="#b5bfd2" stroke-width="1.2"/>`;for(let [id,name,type,x,y,hx,hy] of s.pins){let vertical=x===hx,tx=x===0?x+7:x===s.width?x-7:x,ty=y===0?y+8:y===s.height?y-8:y+2;let anchor=x===s.width||y===0?'end':'start';let nx=vertical?x-3:(x+hx)/2,ny=vertical?(y+hy)/2:y-4;lines+=`<g data-pin="${esc(id)}" style="cursor:grab"><line x1="${x}" y1="${y}" x2="${hx}" y2="${hy}" stroke="transparent" stroke-width="12"/><line x1="${x}" y1="${y}" x2="${hx}" y2="${hy}" stroke="#6479d8" stroke-width="1.3"/><text x="${tx}" y="${ty}" ${vertical?`transform="rotate(-90 ${tx} ${ty})"`:''} text-anchor="${anchor}" font-size="7" fill="#52637c" font-family="Consolas,monospace">${esc(name)}</text><text x="${nx}" y="${ny}" ${vertical?`transform="rotate(-90 ${nx} ${ny})"`:''} font-size="6" text-anchor="middle" fill="#93a0b4" font-family="Consolas,monospace">${esc(id)}</text></g>`}lines+=`<text x="${s.width/2}" y="${s.height/2-5}" text-anchor="middle" font-size="12" font-family="Consolas,monospace" font-weight="bold" fill="#43516b">${esc(state.project.device||'DEVICE')}</text><text x="${s.width/2}" y="${s.height/2+13}" text-anchor="middle" font-size="7" fill="#9ca7ba">${s.pins.length} pins · PART ${esc(activePart)} · 10 MIL</text></g>`;$('svg').innerHTML=lines}
$('stage').addEventListener('wheel',e=>{e.preventDefault();if(!view)return;let r=$('stage').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,old=zoom;zoom=Math.max(.4,Math.min(10,zoom*(e.deltaY<0?1.15:1/1.15)));let k=zoom/old;pan={x:x-(x-pan.x)*k,y:y-(y-pan.y)*k};draw()},{passive:false});
$('stage').oncontextmenu=e=>e.preventDefault();$('stage').onpointerdown=e=>{if(e.target.closest('button'))return;let pin=e.target.closest('[data-pin]');if(e.button===2||e.button===1||!pin){drag={kind:'pan',x:e.clientX,y:e.clientY,pan:{...pan}}}else if(!state.job.busy){drag={kind:'pin',id:pin.dataset.pin,x:e.clientX,y:e.clientY}}if(drag)$('stage').setPointerCapture(e.pointerId)};
$('stage').onpointermove=e=>{if(drag?.kind==='pan'){pan={x:drag.pan.x+e.clientX-drag.x,y:drag.pan.y+e.clientY-drag.y};draw()}};
$('stage').onpointerup=e=>{let d=drag;drag=null;if(!d||d.kind!=='pin'||!view)return;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<5){editDialog(d.id);return}let r=$('stage').getBoundingClientRect(),x=(e.clientX-r.left-view.ox)/view.scale,y=(e.clientY-r.top-view.oy)/view.scale,s=view.s;let side=Object.entries({LEFT:Math.abs(x),RIGHT:Math.abs(x-s.width),TOP:Math.abs(y),BOT:Math.abs(y-s.height)}).sort((a,b)=>a[1]-b[1])[0][0];let before=s.pins.find(p=>p[0]!==d.id&&((side==='LEFT'&&p[3]===0)||(side==='RIGHT'&&p[3]===s.width)||(side==='TOP'&&p[4]===0)||(side==='BOT'&&p[4]===s.height))&&(side==='TOP'||side==='BOT'?p[3]>x:p[4]>y));act({action:'move',id:d.id,side,before:before?.[0]})};$('stage').onpointercancel=()=>drag=null;new ResizeObserver(()=>draw()).observe($('stage'));

async function requestBuild(){
 if(!state||state.job.busy)return;
 await act({action:'metadata',device:$('device').value,footprint:$('footprint').value,expected_count:$('expected').value,profile:$('profile').value});
 if(!state.project.device){$('device').focus();toast('请填写器件名称');return}
 if(!state.project.footprint){$('footprint').focus();toast('请填写 PCB 封装名称');return}
 if(state.issues.length){tab(true);toast('还有 '+state.issues.length+' 项待核对，请处理下方事项后再生成');return}
 if($('build-mode').value==='build-all'){let pcb=state.project.pcb;if(!pcb?.spec||!pcb.confirmed||pcb.needs?.length){pcbTab();toast('请补齐 PCB 参数并确认工艺');return}}
 await act({action:$('build-mode').value});
}

let pcbZoom=1;
function pcbTab(){$('stage').style.display='none';$('review').style.display='none';$('pcb').style.display='block';$('canvas-tab').classList.remove('selected');$('review-tab').classList.remove('selected');$('pcb-tab').classList.add('selected');renderPCB()}
const pcbFields=[['name','封装名（英文）'],['w','本体 X · mm'],['h','本体 Y · mm'],['px','间距 X · mm'],['py','间距 Y · mm'],['rows','行名（如 ABCDE）'],['cols','列数'],['cx','阵列中心 X · mm'],['cy','阵列中心 Y · mm'],['missing','缺球脚号（逗号分隔）'],['ball','球径 · mm'],['pad','铜径 · mm'],['mask','阻焊每侧扩展 · mm'],['paste','锡膏直径 · mm'],['court','Courtyard 外扩 · mm'],['z','器件最大高度 Z · mm']];
function renderPCB(){if($('pcb').contains(document.activeElement))return;let pcb=state.project.pcb||{},s=pcb.spec||{},v={name:s.name||state.project.device.replace(/[^A-Za-z0-9_]/g,'')||'DEVICE',w:s.body?.[0],h:s.body?.[1],px:s.pitch?.[0],py:s.pitch?.[1],rows:s.rows,cols:s.cols,cx:s.centers?.BGA?.[0],cy:s.centers?.BGA?.[1],missing:s.missing?.join(','),ball:s.ball_dia,pad:s.pad_dia,mask:s.mask_margin??.0508,paste:s.paste_dia,court:s.courtyard_excess??.25,z:s.height_max};
 $('pcb').innerHTML=`<p class="pcb-note">CSP / BGA · 顶视图（焊球朝下）· 本体中心为原点 · +Y 向上 · 参数与输出数据库均为 mm，精度 4 位；独立命名焊盘避免旧 PAD 串用，生成后验证 mm / mil 导入。支持滚轮缩放预览。</p>${pcb.needs?.length?`<div class="pcb-warning">待补齐：${pcb.needs.map(esc).join('；')}</div>`:''}<div class="pcb-grid"><div>${s.body?`<div class="pcb-metrics"><div><small>本体尺寸 · mm</small>${s.body.join(' × ')}</div><div><small>阵列间距 · mm</small>${s.pitch.join(' × ')}</div><div><small>球阵列</small>${s.rows.length} 行 × ${s.cols} 列 · ${state.pcb_preview.length} 脚</div><div><small>铜 / 阻焊 / 锡膏直径</small>${s.pad_dia} / ${+(s.pad_dia+2*s.mask_margin).toFixed(4)} / ${s.paste_dia} mm<small>铜径 ${+(s.pad_dia/.0254).toFixed(4)} mil</small></div></div>`:''}<details id="pcb-parameters" ${s.body?'':'open'}><summary>调整尺寸与工艺参数</summary><div class="pcb-fields" style="margin-top:12px">${pcbFields.map(([k,label])=>`<div class="field"><label>${label}</label><input id="pcb-${k}" value="${esc(typeof (v[k]??pcb.draft?.[k])==='number'?+(v[k]??pcb.draft?.[k]).toFixed(8):(v[k]??pcb.draft?.[k]??''))}" ${['name','rows','missing'].includes(k)?'':`type="number" step="any"`} oninput="$('pcb-confirm').checked=false"></div>`).join('')}</div></details><label class="pcb-check"><input id="pcb-confirm" type="checkbox" ${pcb.confirmed?'checked':''}> 我已核对机械尺寸、顶视方向及缺球位，并接受当前铜 / 阻焊 / 锡膏工艺值。</label><div class="actions"><button onclick="savePCB(false)">保存并更新预览</button><button class="primary" onclick="savePCB(true)">确认参数</button></div></div><div><div class="pcb-layers">${Object.entries({pins:'脚号',refs:'REF',centers:'中心标记',bound:'Place Bound'}).map(([k,label])=>`<label><input type="checkbox" ${pcbLayers[k]?'checked':''} onchange="pcbLayers.${k}=this.checked;drawPCB()">${label}</label>`).join('')}</div><div class="pcb-preview" id="pcb-preview"></div><p class="pcb-preview-note">滚轮缩放 · 右键平移 · REF 线宽 0.15 mm · 中心十字线宽 0<br>最大高度：${s.height_max==null?'待填写':esc(s.height_max)+' mm'} · Place Bound 为独立放置区域</p>${(pcb.notes||[]).map(n=>`<p class="pcb-note">${esc(n)}</p>`).join('')}<p class="pcb-note">${pcb.confirmed?'✓ 参数已确认，可联合生成':'待核对 · 工艺值属于参考预设，尚未确认'}</p><details><summary>查看规格书尺寸来源</summary><div class="source">${(pcb.sources||[]).map(x=>`p${x.page} · ${esc(x.field)}: ${esc(x.text)}`).join('<br>')||'暂无自动提取来源，手工填写值请对照规格书。'}</div></details></div></div>`;
 drawPCB();bindPCBPreview();}
async function savePCB(confirming){try{let old=state.project.pcb?.spec||{},val=k=>$('pcb-'+k).value.trim(),num=k=>{if(!val(k))throw Error('请填写 '+pcbFields.find(x=>x[0]===k)[1]);let n=Number(val(k));if(!Number.isFinite(n))throw Error('尺寸无效');return n};let w=num('w'),h=num('h'),px=num('px'),py=num('py'),cx=num('cx'),cy=num('cy'),rows=val('rows').toUpperCase(),cols=num('cols');let spec={...old,name:val('name'),descr:'CSP/BGA top view; mm',body:[w,h],pitch:[px,py],rows,cols,missing:val('missing').split(/[,，\s]+/).filter(Boolean),edge:{left_to_col1:w/2+cx-(cols-1)*px/2,right_to_colN:w/2-cx-(cols-1)*px/2,top_to_rowA:h/2-cy-(rows.length-1)*py/2,bottom_to_rowN:h/2+cy-(rows.length-1)*py/2},centers:{BGA:[cx,cy],OPT:old.centers?.OPT||[cx,cy]},ball_dia:num('ball'),pad_dia:num('pad'),mask_margin:num('mask'),paste_dia:num('paste'),courtyard_excess:num('court'),height_max:num('z'),height_min:old.height_min||0,kicad_version:6};if(confirming&&!$('pcb-confirm').checked){toast('请先勾选参数核对与工艺确认');return}await act({action:'pcb',spec,confirmed:confirming});document.activeElement.blur();renderPCB()}catch(e){toast(e.message)}}
async function downloadResult(){try{let r=await fetch('/api/download',{headers:{'X-Workspace-Token':TOKEN}});if(!r.ok)throw Error('下载未完成，请先生成结果');let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=(state.project.device||'device')+'-symbols-pcb.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){toast(e.message)}}

function metadata(relayout=false){act({action:'metadata',device:$('device').value,footprint:$('footprint').value,expected_count:$('expected').value,profile:$('profile').value,relayout})}
function dialog(html){$('dialog').innerHTML=html;$('dialog').showModal()}function closeDialog(){$('dialog').close()}
function partsDialog(imported=false){dialog(`<h2>${imported?'默认单 PART 布局已生成':'多 PART 管理'}</h2><p>先按默认规则生成完整布局。复杂器件可选择按功能拆分，所有 PART 共用一个物理封装。</p><div class="field"><label>每个 PART 建议最多引脚数</label><input type="number" id="maximum" min="8" max="500" value="64"></div><div class="actions"><button onclick="closeDialog()">${imported?'保留单 PART':'取消'}</button>${imported?'':'<button onclick="act({action:\'merge\'});closeDialog()">合并单 PART</button>'}<button class="primary" onclick="act({action:'split',maximum:$('maximum').value});closeDialog()">按功能拆分</button></div>`)}
function editDialog(id){let p=state.project.pins.find(p=>p.id===id);if(!p)return;dialog(`<h2>${esc(p.id)} · 编辑引脚</h2><div class="field"><label>信号名称</label><input id="pin-name" value="${esc(p.name)}"></div><div class="field"><label>电气类型</label><select id="pin-type"><option value="">请选择</option>${['PWR','GND','NC','IN','OUT','IO','ANA'].map(t=>`<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>位置</label><select id="pin-side">${Object.entries({TOP:'上 · 电源',BOT:'下 · GND',LEFT:'左 · 控制',RIGHT:'右 · MIPI'}).map(([k,v])=>`<option value="${k}" ${k===p.side?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>所属 PART</label><select id="pin-part">${Object.keys(state.project.parts).map(k=>`<option ${k===(p.part||'A')?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="source">来源页码：${esc(p.page||'—')}\n${esc(p.raw||'手工录入')}</div><div class="actions"><button onclick="closeDialog()">取消</button><button class="primary" id="pin-save">保存修改</button></div>`);$('pin-save').onclick=async()=>{await act({action:'edit',id,values:{name:$('pin-name').value,type:$('pin-type').value,side:$('pin-side').value,part:$('pin-part').value}});closeDialog()}}
function referenceDialog(){let r=state.reference.result;dialog(`<h2>截图布局识别完成</h2><p>匹配 ${r.matched} 个引脚，未匹配 ${r.unmatched} 个。${esc(r.note)}</p><p>只调整当前 PART 的位置与顺序，不修改脚号和名称。</p><div class="actions"><button onclick="closeDialog()">暂不应用</button><button class="primary" onclick="act({action:'apply-reference'});closeDialog()">应用到当前 PART</button></div>`)}
function environmentDialog(){dialog(`<h2>OrCAD 本机环境</h2><p>设置本机工具路径，供 Python 生成并回读 OLB。</p>${Object.entries(state.environment).map(([k,v])=>`<div class="field"><label>${esc(k)}</label><input data-env="${esc(k)}" value="${esc(v)}"></div>`).join('')}<div class="actions"><button onclick="closeDialog()">取消</button><button class="primary" id="env-save">保存设置</button></div>`);$('env-save').onclick=()=>{let values={};$('dialog').querySelectorAll('[data-env]').forEach(e=>values[e.dataset.env]=e.value);act({action:'environment',values});closeDialog()}}
function pick(kind){if(!state){toast('本地服务尚未连接，请先启动符号助手，再刷新页面');return}$('file').accept=kind==='reference'?'.png,.jpg,.jpeg,.bmp,.webp':'.pdf,.csv,.json';$('file').onchange=()=>{if($('file').files[0])upload($('file').files[0],kind);$('file').value=''};$('file').click()}
async function upload(file,kind='import'){if(!state){toast('本地服务未连接，请重新启动启动器并刷新页面');return}if(state.job.busy){toast('请等待当前任务完成');return}if(file.size>60*1024*1024){toast('请导入小于 60 MB 的文件');return}let reader=new FileReader();reader.onload=async()=>{if(kind==='import')importPending=true;await act({action:kind,name:file.name,content:reader.result.split(',')[1],part:activePart});lastBusy=!!state.job.busy};reader.readAsDataURL(file)}
document.body.ondragover=e=>{e.preventDefault();$('stage').classList.add('drop-active')};document.body.ondragleave=e=>{if(!e.relatedTarget)$('stage').classList.remove('drop-active')};document.body.ondrop=e=>{e.preventDefault();$('stage').classList.remove('drop-active');let file=e.dataTransfer.files[0];if(file)upload(file,/\.(png|jpe?g|bmp|webp)$/i.test(file.name)?'reference':'import')};
function downloadProject(){let blob=new Blob([JSON.stringify(state.project,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.project.device||'project')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resume(){act({action:'resume'})}function newProject(){if(!state.project.pins.length||confirm('新建空白项目？建议先保存当前项目文件。'))act({action:'new'})}document.onkeydown=e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();downloadProject()}if(e.ctrlKey&&e.key==='z'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();act({action:'undo'})}};refresh();
</script></body></html>
