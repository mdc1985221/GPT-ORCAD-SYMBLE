ess" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="task-progress-label" class="task-progress-label">准备就绪</span><div class="task-progress-track"><div id="task-progress-bar" class="task-progress-bar"></div></div><span id="task-progress-value">就绪</span></div><input type="file" id="file" hidden><dialog id="dialog"></dialog><div class="toast" id="toast"></div>

<script>
// Embedded into index.html by the local improvement script; no network dependency.
function nextWorkflowStep(s, mode, dirty=false){
 const p=s.project, pcb=p.pcb||{};
 if(s.job.busy)return {title:s.job.message,detail:'正在处理，请等待当前任务完成。',label:'处理中',action:'busy'};
 if(!p.pins.length)return {title:'第一步：导入器件资料',detail:'拖入 PDF、CSV 或已保存的项目，先生成完整的默认引脚布局。',label:'导入资料',action:'import'};
 if(dirty)return {title:'PCB 参数有未保存修改',detail:'先保存并更新预览，再核对尺寸与方向。',label:'查看修改',action:'pcb'};
 if((s.issues||[]).length)return {title:`还有 ${s.issues.length} 项引脚信息待核对`,detail:s.issues[0].text,label:'逐项核对',action:'review'};
 if(!p.device||!p.footprint)return {title:!p.device?'填写器件名称':'填写 PCB 封装名称',detail:'封装名称用于 Capture 与 PCB 的关联，请与目标封装一致。',label:'填写名称',action:!p.device?'device':'footprint'};
 if(mode==='build-all'&&(!pcb.spec||!pcb.confirmed||(pcb.needs||[]).length))return {title:'核对 PCB 尺寸和工艺参数',detail:pcb.needs?.length?pcb.needs.join('；'):'确认顶视方向、缺球、铜／阻焊／锡膏尺寸与器件高度。',label:'核对 PCB',action:'pcb'};
 if(p.generated?.olb)return {title:'已有生成结果，可下载或收录到器件库',detail:p.generated.warning||'下载设计用库；需要继续调整时，可修改参数后重新生成。',label:'下载结果',action:'download'};
 return {title:'资料已就绪，可以生成并验证',detail:mode==='build-all'?'将生成 OLB 与 PCB，并执行原生回读校验。':'当前选择仅生成原理符号 OLB。',label:'生成并验证',action:'build'};
}
function renderWorkflow(){
 if(!state)return;
 const step=nextWorkflowStep(state,$('build-mode').value,$('pcb').dataset.dirty==='true');
 $('workflow-title').textContent=step.title;$('workflow-detail').textContent=step.detail;
 const button=$('workflow-next');button.textContent=step.label;button.disabled=step.action==='busy';button.dataset.action=step.action;
 $('workflow-guide').classList.toggle('ready',step.action==='download'||step.action==='build');
}
function workflowNext(){
 const action=$('workflow-next').dataset.action;
 if(action==='import'){pick('import');return}
 if(action==='download'){downloadResult();return}
 if(action==='build'){requestBuild();return}
 editorPage(action==='pcb'?'#pcb':'');
 if(action==='review')tab(true);
 if(action==='device'||action==='footprint'){$(action).focus();$(action).select()}
 if(action==='pcb'&&$('pcb-parameters'))$('pcb-parameters').open=true;
}
function usageGuide(){
